name: Pages från main
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  pages:
    runs-on: ubuntu-latest
    steps:
      - name: Sätt Pages-källa till main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT repos/${{ github.repository }}/pages -f "source[branch]=main" -f "source[path]=/"
          gh api repos/${{ github.repository }}/pages --jq '.source'
      - name: Ta bort gh-pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE repos/${{ github.repository }}/git/refs/heads/gh-pages || true
